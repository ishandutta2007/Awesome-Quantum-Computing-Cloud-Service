<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Quantum Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D1B" />
      <stop offset="50%" stop-color="#121838" />
      <stop offset="100%" stop-color="#070914" />
    </linearGradient>

    <!-- Glowing Cyan/Purple Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <linearGradient id="subGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />

  <!-- Animated Quantum Orbit & Wave Grid (Background Elements) -->
  <g opacity="0.25">
    <ellipse cx="600" cy="200" rx="450" ry="140" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="10,15">
      <animateTransform attributeName="transform" type="rotate" from="0 600 200" to="360 600 200" dur="40s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="200" rx="380" ry="110" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="8,12">
      <animateTransform attributeName="transform" type="rotate" from="360 600 200" to="0 600 200" dur="30s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="200" rx="520" ry="160" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="5,10">
      <animateTransform attributeName="transform" type="rotate" from="90 600 200" to="450 600 200" dur="50s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Animated Glowing Quantum Nodes (Subtle Background Particle Pulse) -->
  <g opacity="0.4">
    <circle cx="200" cy="100" r="4" fill="#00F2FE">
      <animate attributeName="r" values="3;7;3" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="120" r="5" fill="#EC4899">
      <animate attributeName="r" values="4;8;4" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="300" r="6" fill="#A855F7">
      <animate attributeName="r" values="3;9;3" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="280" r="4" fill="#00E5FF">
      <animate attributeName="r" values="2;6;2" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Title Card Overlay (Ensures High Contrast & Readability) -->
  <rect x="120" y="70" width="960" height="260" rx="12" fill="#090D1F" fill-opacity="0.75" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Badge Top -->
  <g transform="translate(600, 115)">
    <rect x="-140" y="-18" width="280" height="32" rx="16" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
    <text x="0" y="3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#A5B4FC" text-anchor="middle" letter-spacing="1.5">⚡ CURATED QUANTUM ECOSYSTEM</text>
  </g>

  <!-- Foreground Main Title -->
  <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="url(#titleGradient)" text-anchor="middle" letter-spacing="-0.5" filter="url(#subtle-glow)">
    Awesome Quantum Computing Cloud Service
  </text>

  <!-- Foreground Subtitle -->
  <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">
    SaaS Products • Open-Source Quantum SDKs • Simulators • Hybrid Algorithms
  </text>

  <!-- Bottom Accent Line -->
  <rect x="450" y="275" width="300" height="3" rx="1.5" fill="url(#subGradient)"/>
</svg>
